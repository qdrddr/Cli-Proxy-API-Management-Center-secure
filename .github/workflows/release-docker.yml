name: Release Docker Image

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Management Center git tag to build (e.g. v1.26.7)
        required: true
        type: string

concurrency:
  group: release-docker-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    environment: build
    permissions:
      contents: read
    env:
      DOCKER_IMAGE: bbkudk/cli-proxy-api-management-center-secure
      NONO_VERSION: "0.80.0"

    steps:
      - name: Checkout repository and submodule
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        run: ./scripts/build-and-push-image.sh "${{ github.event.release.tag_name || inputs.tag }}"
        env:
          DOCKER_IMAGE: ${{ vars.DOCKER_IMAGE || env.DOCKER_IMAGE }}
          NONO_VERSION: ${{ vars.NONO_VERSION || env.NONO_VERSION }}
